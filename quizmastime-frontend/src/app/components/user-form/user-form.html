<mat-card>
  <mat-card-header>
    <mat-card-title>{{ isEditMode ? 'Edit User' : 'Create New User' }}</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
      <mat-form-field appearance="fill" class="full-width">
        <mat-label>First Name (Username)</mat-label>
        <input matInput formControlName="firstName" required>
        <mat-error *ngIf="userForm.get('firstName')?.hasError('required')">
          First name is required
        </mat-error>
        <mat-error *ngIf="userForm.get('firstName')?.hasError('minlength')">
          First name must be at least 2 characters
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Last Name</mat-label>
        <input matInput formControlName="lastName" required>
        <mat-error *ngIf="userForm.get('lastName')?.hasError('required')">
          Last name is required
        </mat-error>
        <mat-error *ngIf="userForm.get('lastName')?.hasError('minlength')">
          Last name must be at least 2 characters
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Birth Date</mat-label>
        <input matInput [matDatepicker]="picker" formControlName="birthDate" required>
        <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
        <mat-error *ngIf="userForm.get('birthDate')?.hasError('required')">
          Birth date is required
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" required>
        <mat-error *ngIf="userForm.get('email')?.hasError('required')">
          Email is required
        </mat-error>
        <mat-error *ngIf="userForm.get('email')?.hasError('email')">
          Please enter a valid email
        </mat-error>
      </mat-form-field>

      <div class="button-group">
        <button mat-raised-button color="primary" type="submit" [disabled]="!userForm.valid">
          {{ isEditMode ? 'Update User' : 'Create User' }}
        </button>
        <button mat-raised-button type="button" (click)="cancelEdit()" *ngIf="isEditMode">
          Cancel
        </button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
