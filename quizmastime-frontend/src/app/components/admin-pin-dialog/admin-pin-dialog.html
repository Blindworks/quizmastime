<h2 mat-dialog-title>Admin-Zugang</h2>

<mat-dialog-content>
  <p>Bitte geben Sie den 4-stelligen PIN ein:</p>

  <mat-form-field appearance="outline" class="pin-field">
    <mat-label>PIN</mat-label>
    <input
      matInput
      type="password"
      inputmode="none"
      maxlength="4"
      [value]="pin"
      (input)="onPinInput($event)"
      (keyup.enter)="onSubmit()"
      autocomplete="off"
      readonly
    >
    <mat-icon matSuffix>lock</mat-icon>
  </mat-form-field>

  <div class="numpad">
    @for (num of [1, 2, 3, 4, 5, 6, 7, 8, 9]; track num) {
      <button mat-raised-button class="numpad-btn" (click)="onNumpadClick(num)">
        {{ num }}
      </button>
    }
    <button mat-raised-button class="numpad-btn delete-btn" (click)="onDeleteClick()">
      <mat-icon>backspace</mat-icon>
    </button>
    <button mat-raised-button class="numpad-btn" (click)="onNumpadClick(0)">
      0
    </button>
    <button mat-raised-button class="numpad-btn enter-btn" color="primary" (click)="onSubmit()" [disabled]="pin.length !== 4">
      <mat-icon>check</mat-icon>
    </button>
  </div>

  @if (errorMessage) {
    <div class="error-message">
      <mat-icon>error</mat-icon>
      {{ errorMessage }}
    </div>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Abbrechen</button>
</mat-dialog-actions>
