<mat-card>
  <mat-card-header>
    <mat-card-title>Preise</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <div class="header-actions">
      <button mat-raised-button color="primary" (click)="onCreatePrize()">
        <mat-icon>add</mat-icon>
        Neuen Preis erstellen
      </button>
    </div>
    <table mat-table [dataSource]="prizes" class="mat-elevation-z8">

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let prize">{{prize.name}}</td>
      </ng-container>

      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef>Beschreibung</th>
        <td mat-cell *matCellDef="let prize">{{prize.description || '-'}}</td>
      </ng-container>

      <ng-container matColumnDef="assignedUser">
        <th mat-header-cell *matHeaderCellDef>Zugewiesen an</th>
        <td mat-cell *matCellDef="let prize">
          <mat-form-field>
            <mat-select
              [value]="prize.assignedUserId || null"
              (selectionChange)="onAssignUser(prize, $event.value)"
              placeholder="Spieler wählen">
              <mat-option [value]="null">Nicht zugewiesen</mat-option>
              <mat-option *ngFor="let user of users" [value]="user.id">
                {{user.firstName}} {{user.lastName}}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Aktionen</th>
        <td mat-cell *matCellDef="let prize">
          <button mat-icon-button color="primary" (click)="onEditPrize(prize)" matTooltip="Preis bearbeiten">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="deletePrize(prize.id)" matTooltip="Preis löschen">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </mat-card-content>
</mat-card>
