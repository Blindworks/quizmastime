<div class="player-selection-container">
  <div class="game-logo">
    <!-- Hier kommt Ihr Logo/Grafik -->
    <h1>QuizmasTime</h1>
  </div>

  <div class="content-wrapper">
    <h2>Wer spielt heute?</h2>

    <!-- Existing Players Grid -->
    <div class="players-grid" *ngIf="!isCreatingNewPlayer && players.length > 0">
      <div
        class="player-card"
        *ngFor="let player of players"
        [class.selected]="selectedPlayer?.id === player.id"
        (click)="selectExistingPlayer(player)">
        <div class="player-avatar">
          <!-- Platzhalter für Avatar-Grafik -->
          <span>{{ player.name.charAt(0).toUpperCase() }}</span>
        </div>
        <div class="player-name">{{ player.name }}</div>
        <div class="player-progress">
          {{ player.correctAnswers }} / 24
        </div>
      </div>

      <!-- New Player Card -->
      <div class="player-card new-player" (click)="showNewPlayerForm()">
        <div class="player-avatar">
          <span>+</span>
        </div>
        <div class="player-name">Neuer Spieler</div>
      </div>
    </div>

    <!-- New Player Form -->
    <div class="new-player-form" *ngIf="isCreatingNewPlayer || players.length === 0">
      <mat-card>
        <mat-card-content>
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Dein Name</mat-label>
            <input
              matInput
              [(ngModel)]="newPlayerName"
              placeholder="Gib deinen Namen ein"
              (keyup.enter)="createNewPlayer()">
          </mat-form-field>

          <div class="form-actions">
            <button mat-raised-button color="primary" (click)="createNewPlayer()" [disabled]="!newPlayerName.trim()">
              Spielen!
            </button>
            <button mat-button (click)="isCreatingNewPlayer = false" *ngIf="players.length > 0">
              Zurück
            </button>
          </div>
        </mat-card-content>
      </mat-card>
    </div>

    <!-- Start Button for Existing Player -->
    <div class="start-button-container" *ngIf="selectedPlayer && !isCreatingNewPlayer">
      <button mat-raised-button color="primary" class="start-button" (click)="startGame()">
        Los geht's!
      </button>
    </div>
  </div>
</div>
