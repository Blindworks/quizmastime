<div class="player-selection-container">
  <div class="game-logo">
    <img src="/assets/images/quizmastime-logo_blue.png" alt="QuizmasTime Logo" class="logo-image">
  </div>

  <!-- Loading Indicator -->
  <div class="loading-container" *ngIf="isLoading">
    <mat-spinner diameter="60"></mat-spinner>
    <p class="loading-text">Verbindung wird hergestellt...</p>
  </div>

  <!-- Error Message -->
  <div class="error-container" *ngIf="!isLoading && loadError">
    <div class="error-message">
      <p>Verbindung zum Server konnte nicht hergestellt werden.</p>
      <button mat-raised-button color="primary" (click)="loadUsers()">
        Erneut versuchen
      </button>
    </div>
  </div>

  <div class="content-wrapper" *ngIf="!isLoading && !loadError">
    <h2>Wer spielt heute?</h2>

    <!-- Existing Users Grid -->
    <div class="players-grid" *ngIf="!isCreatingNewUser && users.length > 0">
      <div
        class="player-card"
        *ngFor="let user of users"
        [class.selected]="selectedUser?.id === user.id"
        (click)="selectExistingUser(user)">
        <div class="player-avatar">
          <img
            [src]="getAvatarUrl(user)"
            [alt]="user.firstName"
            class="avatar-image"
            (error)="onImageError(user)"
            [style.display]="hasImageError(user) ? 'none' : 'block'">
          <span class="avatar-fallback" [style.display]="hasImageError(user) ? 'flex' : 'none'">{{ user.firstName.charAt(0).toUpperCase() }}</span>
        </div>
        <div class="player-name">{{ user.firstName }}</div>
      </div>
    </div>

    <!-- New User Form -->
    <div class="new-player-form" *ngIf="isCreatingNewUser || users.length === 0">
      <mat-card>
        <mat-card-content>
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Vorname</mat-label>
            <input
              matInput
              [(ngModel)]="newUserFirstName"
              placeholder="Gib deinen Vornamen ein">
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Nachname</mat-label>
            <input
              matInput
              [(ngModel)]="newUserLastName"
              placeholder="Gib deinen Nachnamen ein">
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Geburtsdatum</mat-label>
            <input
              matInput
              type="date"
              [(ngModel)]="newUserBirthDate"
              placeholder="Wähle dein Geburtsdatum">
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>E-Mail</mat-label>
            <input
              matInput
              type="email"
              [(ngModel)]="newUserEmail"
              placeholder="Gib deine E-Mail-Adresse ein"
              (keyup.enter)="createNewUser()">
          </mat-form-field>

          <div class="form-actions">
            <button mat-raised-button color="primary" (click)="createNewUser()"
              [disabled]="!newUserFirstName.trim() || !newUserLastName.trim() || !newUserBirthDate || !newUserEmail.trim()">
              Spielen!
            </button>
            <button mat-button (click)="isCreatingNewUser = false" *ngIf="users.length > 0">
              Zurück
            </button>
          </div>
        </mat-card-content>
      </mat-card>
    </div>

  </div>
</div>
