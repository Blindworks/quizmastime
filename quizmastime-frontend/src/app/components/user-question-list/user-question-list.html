<mat-card>
  <mat-card-header>
    <mat-card-title>User Question Assignments</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <table mat-table [dataSource]="userQuestions" class="mat-elevation-z8">

      <ng-container matColumnDef="userName">
        <th mat-header-cell *matHeaderCellDef>User</th>
        <td mat-cell *matCellDef="let uq">{{uq.userName}}</td>
      </ng-container>

      <ng-container matColumnDef="questionText">
        <th mat-header-cell *matHeaderCellDef>Question</th>
        <td mat-cell *matCellDef="let uq" class="question-cell">{{uq.questionText}}</td>
      </ng-container>

      <ng-container matColumnDef="day">
        <th mat-header-cell *matHeaderCellDef>Day</th>
        <td mat-cell *matCellDef="let uq">{{uq.day}}</td>
      </ng-container>

      <ng-container matColumnDef="wrongAttempts">
        <th mat-header-cell *matHeaderCellDef>Wrong Attempts</th>
        <td mat-cell *matCellDef="let uq">{{uq.wrongAttempts}}</td>
      </ng-container>

      <ng-container matColumnDef="lastWrongAnswer">
        <th mat-header-cell *matHeaderCellDef>Last Wrong Answer</th>
        <td mat-cell *matCellDef="let uq">{{formatDate(uq.lastWrongAnswer)}}</td>
      </ng-container>

      <ng-container matColumnDef="correctAnswerDate">
        <th mat-header-cell *matHeaderCellDef>Correct Answer Date</th>
        <td mat-cell *matCellDef="let uq">{{formatDate(uq.correctAnswerDate)}}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let uq">
          <button mat-icon-button color="warn" (click)="deleteUserQuestion(uq.id)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </mat-card-content>
</mat-card>
