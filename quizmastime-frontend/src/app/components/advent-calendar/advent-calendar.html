<div class="calendar-container">
  <!-- Header with player info -->
  <header class="calendar-header" *ngIf="currentUser">
    <div class="player-info">
      <div class="player-avatar">
        {{ currentUser.firstName.charAt(0).toUpperCase() }}
      </div>
      <div class="player-details">
        <h2>{{ currentUser.firstName }} {{ currentUser.lastName }}</h2>
      </div>
    </div>
    <button mat-icon-button (click)="logout()" class="logout-button" matTooltip="Benutzer wechseln">
      <mat-icon>logout</mat-icon>
    </button>
  </header>

  <!-- Main calendar area -->
  <div class="calendar-content">
    <div class="calendar-title">
      <h1>Adventskalender 2024</h1>
      <p class="subtitle">Öffne jeden Tag ein neues Türchen!</p>
    </div>

    <!-- Calendar grid -->
    <div class="calendar-grid">
      <div
        *ngFor="let calendarDay of calendarDays"
        [ngClass]="getDayClasses(calendarDay)"
        (click)="onDayClick(calendarDay)"
        [matTooltip]="calendarDay.isUnlocked ? 'Türchen öffnen' : 'Noch nicht verfügbar'"
        [matTooltipDisabled]="!calendarDay.isUnlocked && !calendarDay.isCompleted">

        <div class="day-number">{{ calendarDay.day }}</div>

        <div class="day-icon" *ngIf="calendarDay.isCompleted">
          <mat-icon>check_circle</mat-icon>
        </div>

        <div class="day-icon lock-icon" *ngIf="!calendarDay.isUnlocked">
          <mat-icon>lock</mat-icon>
        </div>

        <div class="day-decoration" *ngIf="calendarDay.day === 24">
          <mat-icon>card_giftcard</mat-icon>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer decoration area -->
  <div class="calendar-footer">
    <!-- Platz für weihnachtliche Dekorationsgrafiken -->
  </div>
</div>
