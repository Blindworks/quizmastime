<div class="calendar-container">
  <!-- Header with player info -->
  <header class="calendar-header" *ngIf="currentUser">
    <div class="player-info">
      <div class="player-avatar">
        <img
          [src]="getAvatarUrl(currentUser)"
          [alt]="currentUser.firstName"
          class="avatar-image"
          (error)="onImageError()"
          [style.display]="hasImageError ? 'none' : 'block'">
        <span class="avatar-fallback" [style.display]="hasImageError ? 'flex' : 'none'">{{ currentUser.firstName.charAt(0).toUpperCase() }}</span>
      </div>
      <div class="player-details">
        <h2>{{ currentUser.firstName }}</h2>
      </div>
    </div>
    <div class="logout-avatar" (click)="logout()" matTooltip="Zurück">
      <img
        [src]="'/assets/icons/back.png'"
        [alt]="logout"
        class="avatar-image"
        (error)="onLogoutImageError()"
        [style.display]="hasLogoutImageError ? 'none' : 'block'">
      <span class="avatar-fallback" [style.display]="hasLogoutImageError ? 'flex' : 'none'">{{ currentUser.firstName.charAt(0).toUpperCase() }}</span>
    </div>
  </header>

  <!-- Main calendar area -->
  <div class="calendar-content">
    <div class="calendar-title">
      <h1>QuizmasTime 2025</h1>
      <p class="subtitle">Öffne jeden Tag ein neues Türchen!</p>
    </div>

    <!-- Calendar grid -->
    <div class="calendar-grid">
      <div
        *ngFor="let calendarDay of calendarDays"
        [ngClass]="getDayClasses(calendarDay)"
        (click)="onDayClick(calendarDay)"
        [matTooltip]="calendarDay.isUnlocked ? 'Türchen öffnen' : 'Noch nicht verfügbar'"
        [matTooltipDisabled]="!calendarDay.isUnlocked && !calendarDay.isCompleted">

        <!-- Custom Icon für jeden Tag -->
        <div class="day-icon-container">
          <img [src]="calendarDay.iconPath" [alt]="'Tag ' + calendarDay.day" class="day-icon-image" />
        </div>

        <!-- Completed Status -->
        <div class="day-status completed-status" *ngIf="calendarDay.isCompleted">
          <mat-icon>check_circle</mat-icon>
        </div>

        <!-- Locked Status -->
        <div class="day-status lock-status" *ngIf="!calendarDay.isUnlocked">
          <mat-icon>lock</mat-icon>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer decoration area -->
  <div class="calendar-footer">
    <!-- Platz für weihnachtliche Dekorationsgrafiken -->

    <!-- Test Button für Popup -->
    <button mat-raised-button color="accent" (click)="testCongratulationsPopup()" class="test-popup-button">
      <mat-icon>celebration</mat-icon>
      Test Popup
    </button>
  </div>
</div>
