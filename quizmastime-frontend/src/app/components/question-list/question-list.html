<mat-card>
  <mat-card-header>
    <mat-card-title>Questions</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <table mat-table [dataSource]="questions" class="mat-elevation-z8">

      <ng-container matColumnDef="questionText">
        <th mat-header-cell *matHeaderCellDef>Question</th>
        <td mat-cell *matCellDef="let question">{{question.questionText}}</td>
      </ng-container>

      <ng-container matColumnDef="answer1">
        <th mat-header-cell *matHeaderCellDef>Answer 1</th>
        <td mat-cell *matCellDef="let question">{{question.answer1}}</td>
      </ng-container>

      <ng-container matColumnDef="answer2">
        <th mat-header-cell *matHeaderCellDef>Answer 2</th>
        <td mat-cell *matCellDef="let question">{{question.answer2}}</td>
      </ng-container>

      <ng-container matColumnDef="answer3">
        <th mat-header-cell *matHeaderCellDef>Answer 3</th>
        <td mat-cell *matCellDef="let question">{{question.answer3}}</td>
      </ng-container>

      <ng-container matColumnDef="correctAnswer">
        <th mat-header-cell *matHeaderCellDef>Correct Answer</th>
        <td mat-cell *matCellDef="let question">{{getCorrectAnswerText(question)}}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let question">
          <button mat-icon-button color="warn" (click)="deleteQuestion(question.id)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </mat-card-content>
</mat-card>
