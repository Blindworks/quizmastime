# Netlify configuration for QuizmasTime Frontend

[build]
  # Build command
  # Note: legacy-peer-deps is configured in .npmrc file
  # Explicitly use production configuration to ensure environment.prod.ts is used
  command = "npm run build -- --configuration=production"

  # Directory with the built files
  publish = "dist/quizmastime-frontend/browser"

  # Base directory (optional, defaults to root)
  base = "quizmastime-frontend"

[build.environment]
  # Node version for build
  NODE_VERSION = "22"

  # Angular CLI will use production configuration by default
  # The API URL should be configured via Netlify environment variables
  # Set NETLIFY_API_URL in Netlify dashboard

[[redirects]]
  # Redirect all routes to index.html for Angular routing (SPA)
  from = "/*"
  to = "/index.html"
  status = 200

# Optional: Configure headers for better security and caching
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-XSS-Protection = "1; mode=block"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
