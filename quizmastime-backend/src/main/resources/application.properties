spring.application.name=quizmastime-backend

# Database Configuration
# Railway MySQL provides: MYSQL_URL, MYSQL_HOST, MYSQL_PORT, MYSQL_DATABASE, MYSQL_USER, MYSQL_PASSWORD
spring.datasource.url=jdbc:${MYSQL_URL:mysql://localhost:3306/quizmastime}
spring.datasource.username=${MYSQL_USER:quizmastime}
spring.datasource.password=${MYSQL_PASSWORD:taxcRH51#}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server Configuration
# Railway provides PORT environment variable
server.port=${PORT:8080}

# CORS Configuration
# For production, set CORS_ALLOWED_ORIGINS to your frontend URL (e.g., https://quizmastime.netlify.app)
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:https://quizmastime.netlify.app,http://localhost:4200}

# Quiz Lockout Configuration (duration in minutes after wrong answer)
quiz.lockout.duration.minutes=${QUIZ_LOCKOUT_DURATION:30}

# Email Configuration (Gmail SMTP)
# For Gmail, you need to use an App Password (not your regular password)
# Generate one at: https://myaccount.google.com/apppasswords
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Email sender configuration
mail.from.address=${MAIL_FROM_ADDRESS:noreply@quizmastime.com}
mail.from.name=${MAIL_FROM_NAME:QuizmasTime}
