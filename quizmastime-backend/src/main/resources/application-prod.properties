spring.application.name=quizmastime-backend

# Database Configuration
# Railway MySQL provides: MYSQL_URL, MYSQL_HOST, MYSQL_PORT, MYSQL_DATABASE, MYSQL_USER, MYSQL_PASSWORD
spring.datasource.url=jdbc:mysql://35.234.119.79:3306/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server Configuration
# Railway provides PORT environment variable
server.port=${PORT:8080}

# CORS Configuration
# For production, set CORS_ALLOWED_ORIGINS to your frontend URL (e.g., https://quizmastime.netlify.app)
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Quiz Lockout Configuration (duration in minutes after wrong answer)
quiz.lockout.duration.minutes=${QUIZ_LOCKOUT_DURATION:30}