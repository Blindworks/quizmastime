# App Engine Profile Configuration
spring.application.name=quizmastime-backend

# ===================================================================
# Cloud SQL Configuration for App Engine
# ===================================================================
# Cloud SQL connection using Socket Factory
# The CLOUD_SQL_CONNECTION_NAME should be set in app.yaml or environment variables
# Format: project-id:region:instance-name

# Database URL with Socket Factory
spring.datasource.url=jdbc:mysql:///${DB_NAME:quizmastime}?cloudSqlInstance=${CLOUD_SQL_CONNECTION_NAME}&socketFactory=com.google.cloud.sql.mysql.SocketFactory&enabledTLSProtocols=TLSv1.2

# Database credentials
spring.datasource.username=${DB_USER:quizmastime}
spring.datasource.password=${DB_PASSWORD}

# Driver configuration
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# JPA Configuration
# ===================================================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Connection pool configuration for Cloud SQL
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ===================================================================
# Server Configuration
# ===================================================================
# App Engine automatically sets PORT environment variable to 8080
server.port=${PORT:8080}

# ===================================================================
# CORS Configuration
# ===================================================================
# Must be set to your Netlify frontend URL
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# ===================================================================
# Quiz Configuration
# ===================================================================
quiz.lockout.duration.minutes=${QUIZ_LOCKOUT_DURATION:30}

# ===================================================================
# Logging Configuration
# ===================================================================
# App Engine automatically collects logs
logging.level.root=INFO
logging.level.com.quizmastime.backend=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
