runtime: java21

# Instance class for App Engine Standard
# F1 (default): 256MB RAM, 600MHz CPU
# F2: 512MB RAM, 1.2GHz CPU
# F4: 1GB RAM, 2.4GHz CPU
# F4_1G: 2GB RAM, 2.4GHz CPU
instance_class: F2

# Automatic scaling configuration
automatic_scaling:
  min_instances: 0
  max_instances: 5
  min_idle_instances: 0
  max_idle_instances: 1
  min_pending_latency: automatic
  max_pending_latency: 30ms
  target_cpu_utilization: 0.65
  target_throughput_utilization: 0.6

# Environment variables
env_variables:
  # Spring Profile for App Engine
  SPRING_PROFILES_ACTIVE: "appengine"

  # CORS Configuration - MUST be set to your Netlify frontend URL
  CORS_ALLOWED_ORIGINS: "https://your-app.netlify.app"

  # JPA Configuration
  JPA_DDL_AUTO: "update"
  JPA_SHOW_SQL: "false"

  # Quiz Configuration
  QUIZ_LOCKOUT_DURATION: "30"

  # Cloud SQL Configuration
  # Format: project-id:region:instance-name
  # Example: quizmastime-project:europe-west1:quizmastime-mysql
  CLOUD_SQL_CONNECTION_NAME: "your-project-id:your-region:your-instance-name"

  # Database Configuration
  DB_NAME: "quizmastime"
  DB_USER: "quizmastime"
  # Note: DB_PASSWORD should be set via Secret Manager (see documentation)

# Health check configuration
handlers:
- url: /.*
  script: auto
  secure: always
  redirect_http_response_code: 301

# VPC Access (if needed for Cloud SQL private IP)
# vpc_access_connector:
#   name: projects/your-project-id/locations/your-region/connectors/your-connector
